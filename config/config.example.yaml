# Configuration générale de recherche et d'audit AutoHunter
# Copiez ce fichier vers config/config.yaml et complétez votre webhook Discord.

search:
  # Filtres de prix (EUR)
  min_price: 800         # Élimine les annonces à 1 € ou "faire offre" pour pièces
  max_price: 5000        # Budget plafond défini

  # Filtres techniques
  max_mileage: 210000    # Kilométrage max toléré
  min_year: 2001         # Année minimale
  fuel_types:
    - "essence"          # Priorité absolue pour la simplicité et les ZFE

  # Modèles prioritaires : taillés pour conducteur grand gabarit (1m93 / Titan) avec du style et une mécanique saine
  target_models:
    - "Civic"            # Honda Civic 8 (L'ovni : habitacle spacieux, assise basse, i-VTEC indestructible)
    - "C30"              # Volvo C30 (Coupé suédois taillé pour les grands scandinaves, sièges royaux)
    - "Leon"             # Seat Leon 2 (Châssis VAG, volant réglable profondeur/hauteur grand débattement)
    - "Golf"             # Volkswagen Golf 5 (1.6 MPI 102 ch uniquement)
    - "Focus"            # Ford Focus 2 (Très bonne position de conduite, moteurs Duratec)
    - "Megane"           # Renault Mégane 3 Coupé/Berline (1.6 ou 2.0 16v, recul supérieur à Clio)
    - "Mito"             # Alfa Romeo MiTo (1.4 FIRE atmosphérique, assise basse sportive)
    - "Mazda 3"          # Mazda 3 (Moteurs essence MZR à chaîne, ergonomie japonaise basse)
    - "Auris"            # Toyota Auris 1 (Bien plus habitable pour un grand que la Yaris)
    - "Swift"            # Suzuki Swift (Pavillon haut droit offrant une garde au toit surprenante)

  # Périmètre géographique
  location: "France"     # France entière

auditor:
  # Seuil minimal de score pour déclencher une notification (sur 100)
  min_alert_score: 80
  
  # Dépréciation maximale suspecte (au-delà de 65% sous la cote, flag arnaque mandat/acompte)
  scam_discount_threshold_pct: 65

daemon:
  # Intervalle de scraping aléatoire (en secondes) pour éviter le blocage IP
  min_delay_seconds: 480   # 8 minutes
  max_delay_seconds: 900   # 15 minutes
  headless_browser: false

notifier:
  # Renseigne ton URL de webhook Discord ici
  # Exemple : https://discord.com/api/webhooks/123456789/abcdef...
  discord_webhook_url: ""
  
  # Afficher les pépites détectées en direct dans la console / le terminal
  log_to_console: true
